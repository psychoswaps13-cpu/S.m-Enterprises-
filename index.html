<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machinery Parts – Stock Management</title>
<style>
:root{--navy:#0b1a38;--navy2:#13264d;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--purple:#7c3aed;--bg:#f4f7fb;--line:#e5eaf2;--text:#0f1c3a;--muted:#5b6b88}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--navy)}
.lbox{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
.lbox h1{margin:0 0 4px;font-size:22px}.lbox p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}
input,select{width:100%;padding:10px 12px;border:1px solid #cfd8e6;border-radius:8px;background:#fff}
input:focus,select:focus{outline:2px solid #93b4ff;border-color:var(--blue)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.sm{padding:5px 10px;font-size:12px}
.err{color:var(--red);margin-top:10px;min-height:18px;font-size:13px}
#app{display:flex;min-height:100vh}
aside{width:236px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:20;transition:transform .2s}
aside .brand{padding:18px 16px;border-bottom:1px solid #ffffff18}
aside .brand b{font-size:17px;display:block}aside .brand small{color:#9fb0d0}
aside nav{padding:10px;flex:1}
aside nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:8px;color:#e6ecf8;cursor:pointer;margin-bottom:4px;font-weight:600}
aside nav a:hover{background:var(--navy2)}
aside nav a.on{background:var(--blue)}aside nav a.on.out{background:var(--red)}
aside .foot{padding:14px 16px;color:#9fb0d0;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:6px}
.wrap{margin-left:236px;flex:1;min-width:0}
header{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
#burger{display:none;background:none;border:0;font-size:22px;cursor:pointer}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
main{padding:18px}
h2{margin:0}.sub{color:var(--muted);margin:2px 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;gap:14px;align-items:center}
.card .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px}
.card small{color:var(--muted);display:block}.card b{font-size:26px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs a{padding:14px 22px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.tabs a.in.on{color:var(--green);border-color:var(--green)}.tabs a.out.on{color:var(--red);border-color:var(--red)}
.ph{padding:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.ph h3{margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{width:260px;max-width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{background:#f1f5fb;text-align:left;padding:11px 12px;font-size:13px}
td{padding:11px 12px;border-top:1px solid var(--line)}
td small{color:var(--muted)}
.badge{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:#dcfce7;color:#166534}.b-low{background:#fef3c7;color:#92400e}.b-in{background:#dcfce7;color:#166534}.b-out{background:#fee2e2;color:#991b1b}
.pg{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px;color:var(--muted)}
.pg div{display:flex;gap:6px}.pg button{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.pg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:14px}
.mbox{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.mbox h3{margin:0 0 6px}.row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:0 16px 16px}.filters div{min-width:140px;flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;z-index:60}
@media(max-width:860px){
 aside{transform:translateX(-100%)}aside.open{transform:none}
 .wrap{margin-left:0}#burger{display:block}
 .scrim{position:fixed;inset:0;background:#0006;z-index:15}
}
</style>
</head>
<body>

<div id="login">
 <div class="lbox">
  <h1>Machinery Parts</h1><p>Stock Management – login kara</p>
  <label>Username</label><input id="em" autocomplete="username" autocapitalize="none">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="btn" style="width:100%;margin-top:6px" onclick="doLogin()">Login</button>
 </div>
</div>

<div id="app" class="hide">
 <aside id="side">
  <div class="brand"><b>⚙ Machinery Parts</b><small>Stock Management</small></div>
  <nav id="nav"></nav>
  <div class="foot"><span class="dot"></span>System Online<br>Version 1.0.0</div>
 </aside>
 <div class="wrap">
  <header>
   <button id="burger" onclick="toggleSide()">☰</button><span></span>
   <div class="me"><span class="av" id="av"></span><span id="mename"></span>
    <button class="btn ghost sm" onclick="logout()">Logout</button></div>
  </header>
  <main id="main"></main>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== Ithe aplya Supabase chi mahiti taka ======
const SUPABASE_URL = "https://aoaexttdksvunejyxaty.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvYWV4dHRka3N2dW5lanl4YXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMjA5MjksImV4cCI6MjEwODU5NjkyOX0.MkOhvGrQ4b0Od5eiRTxvRTq37lf5MydUUe2V4z4XWlk";
// ==================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => { if(!d) return ''; const [y,m,dd] = String(d).slice(0,10).split('-'); return `${dd}-${m}-${y}`; };
const today = () => new Date().toISOString().slice(0,10);
let me=null, prods=[], tx=[], users=[], view='dashboard', page=1, q='';
const isAdmin = () => me && me.role === 'admin';
const PER = 10;

function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function toggleSide(){ $('#side').classList.toggle('open'); }

// Username -> internal email (user kadhich email baghat nahi)
const toEmail = u => u.trim().toLowerCase().split('@')[0].replace(/\s+/g,'') + '@stockapp.com';
const ADMIN_USER = 'admin';

async function doLogin(){
  $('#lerr').textContent='';
  const {error} = await db.auth.signInWithPassword({email:toEmail($('#em').value), password:$('#pw').value});
  if(error){ $('#lerr').textContent='Username kimva password chukicha ahe.'; return; }
  start();
}
function setupAdmin(){
  modal(`<h3>Admin setup (ek vela)</h3><p class="sub" style="margin:0">Username: <b>${ADMIN_USER}</b> (fix). Fakt password thara.</p>
  <label>Admin Password (min 6 characters)</label><input id="f_pw" type="password" autocomplete="new-password">
  <div class="err" id="ferr"></div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="doSetupAdmin()">Set password</button></div>`);
}
async function doSetupAdmin(){
  const pw = $('#f_pw').value;
  if(pw.length<6){ $('#ferr').textContent='Password kamit kami 6 characters cha asava.'; return; }
  const {data,error} = await db.auth.signUp({email:toEmail(ADMIN_USER), password:pw, options:{data:{full_name:'Admin'}}});
  if(error){ $('#ferr').textContent=error.message; return; }
  if(!data.user || (data.user.identities && !data.user.identities.length)){ $('#ferr').textContent='Admin aadhich banla ahe. Login kara.'; return; }
  closeModal(); start();
}
async function logout(){ await db.auth.signOut(); location.reload(); }

async function start(){
  const {data:{session}} = await db.auth.getSession();
  if(!session){ $('#login').classList.remove('hide'); $('#app').classList.add('hide'); return; }
  const {data:p} = await db.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p || !p.active){ await db.auth.signOut(); $('#lerr').textContent='Tumcha account band ahe. Admin la sanga.'; $('#login').classList.remove('hide'); return; }
  me = p;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#mename').textContent = p.full_name || 'User';
  $('#av').textContent = (p.full_name||'U')[0].toUpperCase();
  await loadAll(); go('dashboard');
}

async function loadAll(){
  const [a,b] = await Promise.all([
    db.from('product_stock').select('*').order('name'),
    db.from('transactions').select('*, products(name,part_number)').order('created_at',{ascending:false}).limit(5000)
  ]);
  prods = a.data || []; tx = b.data || [];
  if(isAdmin()){ const u = await db.from('profiles').select('*').order('full_name'); users = u.data || []; }
}

function go(v){ view=v; page=1; q=''; $('#side').classList.remove('open'); renderNav(); render(); window.scrollTo(0,0); }

function renderNav(){
  const items = [['dashboard','🏠','Dashboard'],['products','📦','Products'],['in','⬇','Stock In'],['out','⬆','Stock Out'],['reports','📊','Reports']];
  if(isAdmin()) items.push(['users','👥','Users']);
  items.push(['settings','⚙','Settings']);
  $('#nav').innerHTML = items.map(([id,ic,l]) => `<a class="${view===id?'on':''} ${id==='out'?'out':''}" onclick="go('${id}')"><span>${ic}</span>${l}</a>`).join('');
}

function render(){
  const m = $('#main');
  if(view==='dashboard') m.innerHTML = vDash();
  else if(view==='products') m.innerHTML = vProducts();
  else if(view==='in'||view==='out') m.innerHTML = vTx(view);
  else if(view==='reports') m.innerHTML = vReports();
  else if(view==='users') m.innerHTML = vUsers();
  else m.innerHTML = vSettings();
}

/* ---------- Dashboard ---------- */
function vDash(){
  const low = prods.filter(p => p.balance <= p.min_stock);
  const total = prods.reduce((s,p)=>s+p.balance,0);
  const card = (ic,col,l,v,go_) => `<div class="card"><div class="ic" style="background:${col}">${ic}</div><div><small>${l}</small><b>${v}</b></div></div>`;
  return `<div class="top"><div><h2>Welcome Back, ${esc(me.full_name)}!</h2><p class="sub">Here's your stock overview for today.</p></div>
  <div class="tools"><button class="btn green" onclick="txForm('in')">⬇ Stock In</button><button class="btn red" onclick="txForm('out')">⬆ Stock Out</button></div></div>
  <div class="cards">${card('📦','var(--blue)','Total Products',prods.length)}${card('🧊','var(--green)','Total Stock (Balance)',total)}${card('⚠','var(--amber)','Low Stock Items',low.length)}${card('🧾','var(--purple)','Total Transactions',tx.length)}</div>
  <div class="panel"><div class="ph"><h3>Low stock items</h3></div><div class="tw">${low.length?`<table><tr><th>Product</th><th>Part Number</th><th>Balance</th><th>Min</th></tr>${low.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.part_number)}</td><td><b>${p.balance}</b></td><td>${p.min_stock}</td></tr>`).join('')}</table>`:'<div class="empty">Sarve items cha stock thik ahe.</div>'}</div></div>
  <div class="panel"><div class="ph"><h3>Recent transactions</h3></div><div class="tw">${tx.length?`<table><tr><th>Date</th><th>Type</th><th>Product</th><th>Qty</th><th>Done By</th></tr>${tx.slice(0,8).map(t=>`<tr><td>${fmtDate(t.tx_date)}</td><td><span class="badge b-${t.type}">${t.type==='in'?'Stock In':'Stock Out'}</span></td><td>${esc(t.products?.name)}</td><td>${t.qty}</td><td>${esc(t.done_by_name)}</td></tr>`).join('')}</table>`:'<div class="empty">Ajun kahi entry nahi.</div>'}</div></div>`;
}

/* ---------- Pagination helper ---------- */
function pager(n){
  const pages = Math.max(1, Math.ceil(n/PER)); if(page>pages) page=pages;
  const from = n? (page-1)*PER+1 : 0, to = Math.min(n, page*PER);
  let btns = '';
  const start = Math.max(1, Math.min(page-2, pages-4)), end = Math.min(pages, start+4);
  for(let i=start;i<=end;i++) btns += `<button class="${i===page?'on':''}" onclick="setPage(${i})">${i}</button>`;
  return `<div class="pg"><span>Showing ${from} to ${to} of ${n} entries</span><div><button onclick="setPage(${page-1})" ${page<=1?'disabled':''}>‹</button>${btns}<button onclick="setPage(${page+1})" ${page>=pages?'disabled':''}>›</button></div></div>`;
}
function setPage(p){ page=p; render(); }
function setQ(v){ q=v.toLowerCase(); page=1; render(); const i=$('#sq'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } }

/* ---------- Stock In / Out ---------- */
function vTx(type){
  let rows = tx.filter(t => t.type===type);
  if(q) rows = rows.filter(t => [t.products?.name,t.products?.part_number,t.invoice_no,t.done_by_name].join(' ').toLowerCase().includes(q));
  const list = rows.slice((page-1)*PER, page*PER);
  const col = type==='in'?'green':'red', lab = type==='in'?'Stock In':'Stock Out';
  return `<div class="panel"><div class="tabs"><a class="in ${type==='in'?'on':''}" onclick="go('in')">⬇ Stock In</a><a class="out ${type==='out'?'on':''}" onclick="go('out')">⬆ Stock Out</a></div>
  <div class="ph"><div><h3>${lab} Details</h3><span class="sub">View all ${lab.toLowerCase()} entries with details</span></div>
  <div class="tools"><input id="sq" placeholder="Search product, part number, invoice..." value="${esc(q)}" oninput="setQ(this.value)"><button class="btn ${col}" onclick="txForm('${type}')">+ ${lab}</button><button class="btn ghost" onclick="exportTx('${type}')">Export Excel</button></div></div>
  <div class="tw"><table><tr><th>Sr.</th><th>Date</th><th>Invoice No.</th><th>Product</th><th>Part No.</th><th>Qty</th><th>Done By</th><th>Remarks</th>${isAdmin()?'<th></th>':''}</tr>
  ${list.map((t,i)=>`<tr><td>${(page-1)*PER+i+1}</td><td>${fmtDate(t.tx_date)}</td><td>${esc(t.invoice_no)}</td><td>${esc(t.products?.name)}</td><td>${esc(t.products?.part_number)}</td><td><b>${t.qty}</b></td><td>${esc(t.done_by_name)}</td><td>${esc(t.remarks)}</td>${isAdmin()?`<td><button class="btn red sm" onclick="delTx(${t.id})">Delete</button></td>`:''}</tr>`).join('')}</table>
  ${rows.length?'':'<div class="empty">Kahi entry sapadli nahi.</div>'}</div>${pager(rows.length)}</div>`;
}

function txForm(type){
  if(!prods.length){ toast('Aadhi Products madhe product add kara (Admin).'); return; }
  const lab = type==='in'?'Stock In':'Stock Out';
  modal(`<h3>${lab}</h3>
   <label>Product</label><select id="f_p">${prods.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.part_number)}) – stock: ${p.balance}</option>`).join('')}</select>
   <label>Quantity</label><input id="f_q" type="number" min="1" inputmode="numeric">
   <label>Invoice No.</label><input id="f_i">
   <label>Date</label><input id="f_d" type="date" value="${today()}">
   <label>Remarks</label><input id="f_r">
   <div class="err" id="ferr"></div>
   <div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ${type==='in'?'green':'red'}" onclick="saveTx('${type}')">Save ${lab}</button></div>`);
}
async function saveTx(type){
  const qty = parseInt($('#f_q').value,10);
  if(!qty || qty<1){ $('#ferr').textContent='Quantity barobar taka.'; return; }
  const {error} = await db.from('transactions').insert({type, product_id:+$('#f_p').value, qty, invoice_no:$('#f_i').value.trim(), remarks:$('#f_r').value.trim(), tx_date:$('#f_d').value||today(), done_by_name:`${me.full_name} (${me.designation||'Staff'})`});
  if(error){ $('#ferr').textContent = error.message; return; }
  closeModal(); toast('Save jhale'); await loadAll(); render();
}
async function delTx(id){
  if(!confirm('Hi entry delete karaychi ka?')) return;
  const {error} = await db.from('transactions').delete().eq('id',id);
  if(error){ toast(error.message); return; }
  await loadAll(); render();
}

/* ---------- Products ---------- */
function vProducts(){
  let rows = prods; if(q) rows = rows.filter(p => (p.name+' '+p.part_number).toLowerCase().includes(q));
  const list = rows.slice((page-1)*PER, page*PER);
  return `<div class="panel"><div class="ph"><div><h3>Products</h3><span class="sub">Sarve products ani current stock</span></div>
  <div class="tools"><input id="sq" placeholder="Search product or part number..." value="${esc(q)}" oninput="setQ(this.value)">${isAdmin()?'<button class="btn" onclick="prodForm()">+ Add Product</button>':''}</div></div>
  <div class="tw"><table><tr><th>Sr.</th><th>Product</th><th>Part No.</th><th>Balance</th><th>Min Stock</th><th>Status</th>${isAdmin()?'<th></th>':''}</tr>
  ${list.map((p,i)=>`<tr><td>${(page-1)*PER+i+1}</td><td>${esc(p.name)}</td><td>${esc(p.part_number)}</td><td><b>${p.balance}</b></td><td>${p.min_stock}</td><td><span class="badge ${p.balance<=p.min_stock?'b-low':'b-ok'}">${p.balance<=p.min_stock?'Low':'OK'}</span></td>${isAdmin()?`<td><button class="btn ghost sm" onclick="prodForm(${p.id})">Edit</button> <button class="btn red sm" onclick="delProd(${p.id})">Delete</button></td>`:''}</tr>`).join('')}</table>
  ${rows.length?'':'<div class="empty">Ajun product nahi.</div>'}</div>${pager(rows.length)}</div>`;
}
function prodForm(id){
  const p = prods.find(x=>x.id===id) || {name:'',part_number:'',min_stock:10};
  modal(`<h3>${id?'Edit':'Add'} Product</h3>
   <label>Product Name</label><input id="f_n" value="${esc(p.name)}">
   <label>Part Number</label><input id="f_pn" value="${esc(p.part_number)}">
   <label>Low stock warning (min qty)</label><input id="f_m" type="number" min="0" value="${p.min_stock}">
   <div class="err" id="ferr"></div>
   <div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveProd(${id||0})">Save</button></div>`);
}
async function saveProd(id){
  const row = {name:$('#f_n').value.trim(), part_number:$('#f_pn').value.trim(), min_stock:parseInt($('#f_m').value,10)||0};
  if(!row.name || !row.part_number){ $('#ferr').textContent='Name ani Part Number dya.'; return; }
  const {error} = id ? await db.from('products').update(row).eq('id',id) : await db.from('products').insert(row);
  if(error){ $('#ferr').textContent = error.code==='23505' ? 'Ha Part Number aadhich ahe.' : error.message; return; }
  closeModal(); await loadAll(); render();
}
async function delProd(id){
  if(!confirm('Product delete karaycha ka?')) return;
  const {error} = await db.from('products').delete().eq('id',id);
  if(error){ toast('Hya product chya stock entries ahet, delete hou shakat nahi.'); return; }
  await loadAll(); render();
}

/* ---------- Reports ---------- */
let rf = {from:'', to:'', type:''};
function reportRows(){ return tx.filter(t => (!rf.type||t.type===rf.type) && (!rf.from||t.tx_date>=rf.from) && (!rf.to||t.tx_date<=rf.to)); }
function vReports(){
  const rows = reportRows(), sIn = rows.filter(t=>t.type==='in').reduce((s,t)=>s+t.qty,0), sOut = rows.filter(t=>t.type==='out').reduce((s,t)=>s+t.qty,0);
  return `<div class="panel"><div class="ph"><div><h3>Reports</h3><span class="sub">Date ani type pramane filter kara</span></div><button class="btn ghost" onclick="exportRows(reportRows(),'report')">Export Excel</button></div>
  <div class="filters"><div><label>From</label><input type="date" value="${rf.from}" onchange="rf.from=this.value;page=1;render()"></div><div><label>To</label><input type="date" value="${rf.to}" onchange="rf.to=this.value;page=1;render()"></div>
  <div><label>Type</label><select onchange="rf.type=this.value;page=1;render()"><option value="">All</option><option value="in" ${rf.type==='in'?'selected':''}>Stock In</option><option value="out" ${rf.type==='out'?'selected':''}>Stock Out</option></select></div></div>
  <div class="filters"><span class="badge b-in">Total In: ${sIn}</span><span class="badge b-out">Total Out: ${sOut}</span><span class="badge b-low">${rows.length} entries</span></div>
  <div class="tw"><table><tr><th>Date</th><th>Type</th><th>Invoice</th><th>Product</th><th>Qty</th><th>Done By</th></tr>
  ${rows.slice((page-1)*PER,page*PER).map(t=>`<tr><td>${fmtDate(t.tx_date)}</td><td><span class="badge b-${t.type}">${t.type==='in'?'In':'Out'}</span></td><td>${esc(t.invoice_no)}</td><td>${esc(t.products?.name)}</td><td>${t.qty}</td><td>${esc(t.done_by_name)}</td></tr>`).join('')}</table>
  ${rows.length?'':'<div class="empty">Kahi entry nahi.</div>'}</div>${pager(rows.length)}</div>`;
}

/* ---------- Users (admin) ---------- */
function vUsers(){
  return `<div class="panel"><div class="ph"><div><h3>Users</h3><span class="sub">Navin staff ithunch add kara: naav, username ani password dya.</span></div><button class="btn" onclick="addUserForm()">+ Add Staff</button></div>
  <div class="tw"><table><tr><th>Name</th><th>Designation</th><th>Role</th><th>Status</th><th></th></tr>
  ${users.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.designation)}</td><td><span class="badge ${u.role==='admin'?'b-out':'b-in'}">${u.role}</span></td><td>${u.active?'Active':'Band'}</td><td><button class="btn ghost sm" onclick="userForm('${u.id}')">Edit</button></td></tr>`).join('')}</table></div></div>`;
}
function addUserForm(){
  modal(`<h3>Add Staff</h3><label>Full Name</label><input id="f_n">
  <label>Designation</label><input id="f_ds" placeholder="Store Keeper / Store Incharge">
  <label>Username (login sathi, jase: rahul)</label><input id="f_em" autocomplete="off" autocapitalize="none">
  <label>Password (min 6 characters)</label><input id="f_pw" type="text" autocomplete="off">
  <label>Role</label><select id="f_ro"><option value="staff">Staff (fakt in/out ani baghne)</option><option value="admin">Admin (sarv kahi)</option></select>
  <div class="err" id="ferr"></div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="addUser()">Add</button></div>`);
}
async function addUser(){
  const name=$('#f_n').value.trim(), uname=$('#f_em').value.trim(), pw=$('#f_pw').value;
  if(!name||!uname||pw.length<6){ $('#ferr').textContent='Naav, username ani 6+ characters cha password dya.'; return; }
  if(/\s/.test(uname)){ $('#ferr').textContent='Username madhe space nako.'; return; }
  const em = toEmail(uname);
  // Vegla client: Admin cha swatacha login badlat nahi
  const tmp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {data,error} = await tmp.auth.signUp({email:em, password:pw, options:{data:{full_name:name}}});
  if(error){ $('#ferr').textContent=error.message; return; }
  if(!data.user || (data.user.identities && !data.user.identities.length)){ $('#ferr').textContent='Ha username aadhich vaparla ahe.'; return; }
  const {error:e2} = await db.from('profiles').update({full_name:name, designation:$('#f_ds').value.trim(), role:$('#f_ro').value, active:true}).eq('id',data.user.id);
  if(e2){ $('#ferr').textContent=e2.message; return; }
  closeModal(); toast('Staff add jhala'); await loadAll(); render();
}
function userForm(id){
  const u = users.find(x=>x.id===id);
  modal(`<h3>Edit User</h3><label>Full Name</label><input id="f_n" value="${esc(u.full_name)}">
  <label>Designation</label><input id="f_ds" value="${esc(u.designation)}" placeholder="Store Keeper / Store Incharge">
  <label>Role</label><select id="f_ro"><option value="staff" ${u.role==='staff'?'selected':''}>Staff (fakt in/out ani baghne)</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin (sarv kahi)</option></select>
  <label>Status</label><select id="f_ac"><option value="true" ${u.active?'selected':''}>Active</option><option value="false" ${!u.active?'selected':''}>Band (login nahi)</option></select>
  <div class="err" id="ferr"></div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveUser('${id}')">Save</button></div>`);
}
async function saveUser(id){
  if(id===me.id && ($('#f_ro').value!=='admin' || $('#f_ac').value!=='true')){ $('#ferr').textContent='Swatachi Admin role kimva status badlu naka.'; return; }
  const {error} = await db.from('profiles').update({full_name:$('#f_n').value.trim(), designation:$('#f_ds').value.trim(), role:$('#f_ro').value, active:$('#f_ac').value==='true'}).eq('id',id);
  if(error){ $('#ferr').textContent=error.message; return; }
  closeModal(); await loadAll(); render();
}

/* ---------- Settings ---------- */
function vSettings(){
  return `<div class="panel"><div class="ph"><h3>Settings</h3></div><div style="padding:0 16px 20px;max-width:380px">
  <label>Navin Password (min 6 characters)</label><input id="np" type="password" autocomplete="new-password"><div class="err" id="ferr"></div>
  <button class="btn" onclick="changePw()">Password badla</button></div></div>`;
}
async function changePw(){
  const v = $('#np').value; if(v.length<6){ $('#ferr').textContent='Password kamit kami 6 characters cha asava.'; return; }
  const {error} = await db.auth.updateUser({password:v});
  if(error){ $('#ferr').textContent=error.message; return; }
  $('#np').value=''; toast('Password badalla');
}

/* ---------- Export (CSV, Excel madhe ughadto) ---------- */
function exportTx(type){ exportRows(tx.filter(t=>t.type===type), type==='in'?'stock-in':'stock-out'); }
function exportRows(rows,name){
  const head = ['Date','Type','Invoice No','Product','Part Number','Qty','Done By','Remarks'];
  const c = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines = [head.map(c).join(',')].concat(rows.map(t=>[fmtDate(t.tx_date),t.type,t.invoice_no,t.products?.name,t.products?.part_number,t.qty,t.done_by_name,t.remarks].map(c).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download = `${name}-${today()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- Modal ---------- */
function modal(html){ closeModal(); const d=document.createElement('div'); d.className='modal'; d.id='modal'; d.innerHTML=`<div class="mbox">${html}</div>`; document.body.appendChild(d); }
function closeModal(){ const m=$('#modal'); if(m) m.remove(); }

$('#pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
start();
</script>
